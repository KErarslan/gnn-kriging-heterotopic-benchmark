    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #222222" x="253.814173" y="226.262351" transform="rotate(-0 253.814173 226.262351)">no / unknown</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="181.814173" y="249.532603" transform="rotate(-0 181.814173 249.532603)">KED is enough</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 260.220747)">With a correctly specified drift and no</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 268.455747)">coupling, KED-sel had the lower MAE in</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 276.690747)">40/40 synthetic runs; with the coupling</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 284.925747)">broken on Walker Lake (fully rotated),</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 293.511974)">GNN-K / KED-sel MAE ratio = 1.14.</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 299.712529)"/>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 309.630747)">Noise changes the size of the difference,</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(181.814173 318.456685)">not its direction.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(18.538583 343.694359)">Computing time per outer fold, nested selection included (one CPU core): kriging 0.2–3.5 s · KED-sel 1–7 s · NN-GLS 27–43 s ·</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(18.538583 351.929359)">GNN-K 53–97 s · GNN-K-L 187–418 s. Full design with all 7 neural candidates (GNN-sel): ≈ 13 h (Meuse), ≈ 26 h (Jura); KED-sel: minutes.</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(18.538583 360.164359)">Evidence base: synthetic fields, Walker Lake, Jura, Meuse. The questions are qualitative; no thresholds are calibrated.</text>
   </g>
  </g>
 </g>
