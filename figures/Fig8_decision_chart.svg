   <g id="text_1">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(143.023173 24.651644)">Heterotopic prediction: auxiliaries known at every prediction location</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(110.680673 32.971644)">Step 0 — always fit KED (linear and spline drift, selected on inner folds): seconds per fold</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'" transform="translate(201.229454 74.873206)">Q1  Is the target nearly noise-free</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'" transform="translate(208.291158 82.859097)">after the drift? (small relative</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'" transform="translate(206.515923 90.373206)">nugget; e.g. exhaustive fields)</text>
   </g>
