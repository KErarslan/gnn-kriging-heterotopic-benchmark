    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #222222" x="100.743307" y="72.600361" transform="rotate(-0 100.743307 72.600361)">no — typical field data</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #009e73" x="17.404724" y="249.532603" transform="rotate(-0 17.404724 249.532603)">Keep the kriging framework</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 260.220747)">KED is the reference. Pure GNNs gain little</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 268.455747)">and not reliably: Jura ≈ KED; on Meuse</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 276.690747)">(n = 155) most variants had significantly</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 284.925747)">higher MAE on Zn and Pb. If a neural model</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 293.160747)">is wanted, use a hybrid that keeps kriging:</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 301.627833)">NN-GLS (NN drift under GLS + OK of residual).</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 309.630747)">Never significantly less accurate than KED-lin;</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(17.404724 317.865747)">MAE: Jura −4 to −10 %, Meuse ≈ equal.</text>
   </g>
   <g id="text_6">
    <g id="patch_18">
