    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #222222" x="395.546457" y="171.828341" transform="rotate(-0 395.546457 171.828341)">yes</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="346.223622" y="249.532603" transform="rotate(-0 346.223622 249.532603)">Learned kriging can outperform KED</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 260.811685)">GNN-K: 30 % lower MAE than KED-sel on</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 268.455747)">Walker Lake (ratio 0.70, 5 random samples).</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 276.690747)">Gain sits where the latent factor is high</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 285.157833)">(Q4 ratio ≈ 0.6); elsewhere no consistent</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 293.160747)">advantage. Smaller under clustered</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 301.395747)">sampling (0.82). Breaking the level coupling</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 309.630747)">removes ≈ 2/3 of the gain. Still validate</text>
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(346.223622 317.865747)">against KED on inner folds.</text>
   </g>
