    <text style="font-weight: 700; font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #222222" x="253.814173" y="129.30196" transform="rotate(-0 253.814173 129.30196)">yes</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'" transform="translate(201.126283 174.101429)">Q2  Is the auxiliary coupled to the</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'" transform="translate(210.066876 182.452054)">LEVEL of a latent factor that</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'" transform="translate(226.224173 189.601429)">drives the target?</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #222222" x="358.696063" y="96.320791" transform="rotate(-0 358.696063 96.320791)">Examples for Q2</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(358.696063 108.396549)">Walker Lake: U = roughness of the surface</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(358.696063 116.498424)">whose elevation scales V.</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(358.696063 123.476549)">Mining: a lithology or alteration proxy that</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(358.696063 131.016549)">is high where the background grade of the</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(358.696063 138.556549)">ore domain is high.</text>
   </g>
   <g id="text_10">
    <g id="patch_19">
